name: Publish Gmail EA image

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/publish-gmail-ea.yml"
      - "tools/executive-assistant/Dockerfile"
      - "tools/executive-assistant/.dockerignore"
      - "tools/executive-assistant/package.json"
      - "tools/executive-assistant/package-lock.json"
      - "tools/executive-assistant/*.js"
      - "tools/executive-assistant/ui/**"

concurrency:
  group: publish-gmail-ea
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  attestations: write

jobs:
  publish:
    name: Build and push GHCR image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE: ghcr.io/project-noemi/gmail-executive-assistant
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: tools/executive-assistant
          file: tools/executive-assistant/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/project-noemi/agents
            org.opencontainers.image.title=gmail-executive-assistant
            org.opencontainers.image.description=Project NoéMI Gmail executive assistant

      - name: Make the package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pkg=gmail-executive-assistant
          echo '--- GET org package ---'
          gh api "orgs/project-noemi/packages/container/${pkg}" || true
          echo '--- GET repo package ---'
          gh api "repos/project-noemi/agents/packages/container/${pkg}" || true
          echo '--- PATCH org visibility ---'
          gh api --method PATCH \
            -H "Accept: application/vnd.github.package-deletes-preview+json" \
            "orgs/project-noemi/packages/container/${pkg}" \
            -f visibility=public || true
          echo '--- PUT org visibility ---'
          gh api --method PUT \
            "orgs/project-noemi/packages/container/${pkg}/visibility" \
            -f visibility=public || true
          echo '--- PATCH repo visibility ---'
          gh api --method PATCH \
            -H "Accept: application/vnd.github.package-deletes-preview+json" \
            "repos/project-noemi/agents/packages/container/${pkg}" \
            -f visibility=public || true

      - name: Inspect the published manifest (authenticated)
        run: docker buildx imagetools inspect "${IMAGE}:latest"

      - name: Inspect the published manifest (anonymous)
        run: |
          docker logout ghcr.io || true
          docker manifest inspect "${IMAGE}:latest"
